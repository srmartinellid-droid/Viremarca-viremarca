name: Quality gate

on:
  push:
    branches:
      - main
      - feature/analytics-completo
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Temporary npm install lockfile synchronization
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'seo-release-gate-')
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const p = require('./package.json');
          const l = require('./package-lock.json');
          if (p.dependencies.next !== '15.5.24') throw new Error('package.json Next.js is not 15.5.24');
          if (l.packages?.[''].dependencies?.next !== '15.5.24') throw new Error('lockfile root Next.js does not match 15.5.24');
          if (l.packages?.['node_modules/next']?.version !== '15.5.24') throw new Error('resolved Next.js package is not 15.5.24');
          console.log('Verified Next.js 15.5.24 in package.json and package-lock.json.');
          NODE
          git diff --check
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): synchronize npm lockfile"
          git push origin "HEAD:$HEAD_REF"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
