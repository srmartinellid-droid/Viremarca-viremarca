name: Temporary package-lock sync

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'seo-release-gate-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync lockfile using npm install only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exact Next.js version and lockfile consistency
        run: |
          node <<'NODE'
          const p = require('./package.json');
          const l = require('./package-lock.json');
          if (p.dependencies.next !== '15.5.24') throw new Error('package.json Next.js is not 15.5.24');
          if (l.packages?.[''].dependencies?.next !== '15.5.24') throw new Error('lockfile root Next.js does not match 15.5.24');
          if (l.packages?.['node_modules/next']?.version !== '15.5.24') throw new Error('resolved Next.js package is not 15.5.24');
          if (l.packages?.[''].devDependencies?.['eslint-config-next'] !== p.devDependencies['eslint-config-next']) throw new Error('eslint-config-next root mismatch');
          console.log('Verified: package.json and package-lock.json agree; Next.js = 15.5.24');
          NODE
          git diff --check
          git diff --stat -- package-lock.json
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): synchronize npm lockfile"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
